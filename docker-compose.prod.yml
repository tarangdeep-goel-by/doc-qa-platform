# Production overlay — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in GEMINI_API_KEY
#   2. (Optional) Set JWT_SECRET for SaaS mode
#   3. (Optional) Point a domain to your VPS IP and update CORS_ORIGINS + Caddyfile

services:
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"  # Localhost only — not exposed to internet
      - "127.0.0.1:6334:6334"
    restart: always

  backend:
    ports:
      - "80:8000"  # Expose on port 80 (no TLS without domain)
    environment:
      CORS_ORIGINS: "*"  # Tighten to https://yourdomain.com when you add a domain
      COOKIE_SECURE: "false"  # Set to true when you add HTTPS
      LOG_LEVEL: "WARNING"
    restart: always

