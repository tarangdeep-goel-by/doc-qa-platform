# Production overlay — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Set GEMINI_API_KEY and JWT_SECRET in .env
#   2. Replace yourdomain.com with your actual domain
#   3. Ensure DNS A record points to your VPS IP

services:
  caddy:
    image: caddy:2-alpine
    container_name: doc-qa-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  qdrant:
    restart: always

  backend:
    ports: []  # Only expose via Caddy
    environment:
      CORS_ORIGINS: "https://yourdomain.com"
      COOKIE_SECURE: "true"
      LOG_LEVEL: "WARNING"
    restart: always

volumes:
  caddy_data:
  caddy_config:
