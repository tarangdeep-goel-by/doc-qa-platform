x-env-common: &env-common
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: gemini-2.5-flash
  GEMINI_FAST_MODEL: gemini-2.5-flash-lite
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  EMBEDDING_MODEL: gemini-embedding-001
  EMBEDDING_DIM: "768"
  BM25_CACHE_DIR: data/bm25
  RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
  USE_RERANKING: "true"
  USE_HYBRID_SEARCH: "true"
  HYBRID_ALPHA: "0.5"
  USE_QUERY_EXPANSION: "true"
  QUERY_EXPANSION_VARIANTS: "2"
  RERANKER_BLENDING: position_aware
  USE_QUERY_DECOMPOSITION: "true"
  USE_ADAPTIVE_ALPHA: "true"
  TOP_K_RESULTS: "12"
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_ACCESS_EXPIRY_MINUTES: "15"
  JWT_REFRESH_EXPIRY_DAYS: "7"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: doc-qa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-qa-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/evaluation/results:/app/evaluation/results
    environment:
      <<: *env-common
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATA_DIR: data
      UPLOAD_DIR: data/uploads
      CHUNK_SIZE: "2500"
      CHUNK_OVERLAP: "500"
      USE_SEMANTIC_CHUNKING: "false"
      USE_PDFPLUMBER: "true"
      ALLOWED_ORIGINS: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:3000"
      COOKIE_SECURE: "false"
      MAX_UPLOAD_SIZE_MB: "50"
      LOG_LEVEL: "INFO"
      CLIENT_DOCUMENT_VIEW: "true"
    depends_on:
      qdrant:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  # Run all tests
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-qa-test
    volumes:
      - ./backend:/app
    environment:
      <<: *env-common
      TEST_BASE_URL: http://backend:8000
      TEST_PDF_PATH: tests/fixtures/test.pdf
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATA_DIR: data
      UPLOAD_DIR: data/uploads
      CHUNK_SIZE: "2500"
      CHUNK_OVERLAP: "500"
      USE_SEMANTIC_CHUNKING: "false"
    depends_on:
      - backend
      - qdrant
    command: pytest tests/ -v --tb=short
    profiles:
      - test

  # Run unit tests only (fast, no external dependencies)
  unit-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-qa-unit-tests
    volumes:
      - ./backend:/app
    environment:
      <<: *env-common
    command: pytest tests/test_bm25_index.py tests/test_reranker.py -v --tb=short
    profiles:
      - test

  # Run integration tests (needs Qdrant)
  integration-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-qa-integration-tests
    volumes:
      - ./backend:/app
    environment:
      <<: *env-common
    depends_on:
      - qdrant
    command: pytest tests/test_hybrid_search.py tests/test_qa_guardrails.py tests/test_rag_pipeline_integration.py -v --tb=short
    profiles:
      - test

  # Run API tests only (needs backend + Qdrant)
  api-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-qa-api-tests
    volumes:
      - ./backend:/app
    environment:
      <<: *env-common
      TEST_BASE_URL: http://backend:8000
      TEST_PDF_PATH: tests/fixtures/test.pdf
    depends_on:
      - backend
      - qdrant
    command: pytest tests/test_api.py tests/test_deleted_documents.py -v --tb=short
    profiles:
      - test
